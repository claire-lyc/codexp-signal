services:
  postgres:
    image: postgres:16-alpine
    container_name: signal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal}
      POSTGRES_USER: ${POSTGRES_USER:-signal_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - signal_postgres_data:/var/lib/postgresql/data
      - ./database:/workspace/database:ro

volumes:
  signal_postgres_data:
